name: Changelog check

# Velisa's reusable changelog-check.yml (Velisa ADR-022, decision D36): every level-2 heading of
# CHANGELOG.md is a version heading (or Unreleased), each version once, newest first, and a pull
# request that changes the version adds that version's heading.

on:
  pull_request:

permissions:
  contents: read

jobs:
  changelog:
    uses: kajisho5/Velisa/.github/workflows/changelog-check.yml@main
