name: release

# Single job, triggered on every push to main. Deliberately not a tag-triggered second workflow: a tag pushed
# by this job's own GITHUB_TOKEN would not start another workflow run (GitHub's anti-recursion rule for the
# default token), so a `push: tags:` workflow downstream of this one would simply never fire.
on:
  push:
    branches: [main]

permissions:
  contents: write
  # write: the step before release-drafter removes release-level labels a bot put on Dependabot pull requests
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      # Dependabot labels a pull request `major` when the dependency it bumps moved a major version, which says
      # nothing about this product's version. A release-level label on a Dependabot pull request counts only when a
      # person applied it; a failure here fails the release instead of resolving from unchecked labels.
      - name: Drop release-level labels a bot put on Dependabot pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/dependabot_release_labels.py

      # Velisa ADR-023: pull requests labelled only chore / ci / docs / test release nothing. release-drafter's
      # `default` cannot say "no release", so release_gate.py answers that from the merged pull requests' labels.
      - name: Decide whether anything merged since the latest tag is releasable
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release_gate.py

      # Dry run: only resolves the next version from the labels of PRs merged since the last release
      # (release-drafter.yml's version-resolver; unlabeled PRs default to patch). Creates no draft, no release.
      # Skipped when the gate found nothing releasable: an empty RESOLVED_VERSION is "nothing to release" in release.py.
      - name: Resolve next version (release-drafter, dry run)
        id: drafter
        if: steps.gate.outputs.releasable != 'false'
        # v7's dry-run resolves without writing a draft. v6 with disable-releaser skipped the drafting
        # that computes resolved_version, so every release after the first would have found it empty
        # and quietly released nothing.
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: release-drafter.yml
          dry-run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Every value this script needs from the event/secrets is passed as an *environment variable*, never
      # spliced into the run: script text with ${{ }} -- the classic Actions script-injection pattern. The
      # script itself reads git history via `git log` (subprocess, not shell string interpolation) to build
      # CHANGELOG.md, so an adversarial commit subject or PR title can change the text written to the file, but
      # cannot escape into a shell command.
      - name: Determine version, update pyproject.toml, generate CHANGELOG.md, tag
        id: release
        env:
          RESOLVED_VERSION: ${{ steps.drafter.outputs.resolved_version }}
          HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
        run: python .github/scripts/release.py

      # The release commit is pushed with GITHUB_TOKEN, so no workflow runs on it on main: test it here, before
      # it is pushed. A failure stops the release; main and the tags stay as they were (Velisa ADR-023).
      - name: Test the release commit before pushing it
        if: steps.release.outputs.released == 'true'
        run: |
          python3 -m pip install -q -e . pytest
          python3 -m pytest -q tests/test_unit.py tests/test_contract.py tests/test_contract_file.py tests/test_release_labels.py tests/test_release_script.py tests/test_release_gate.py

      - name: Push release commit and tag
        if: steps.release.outputs.released == 'true'
        run: git push origin HEAD:main "${{ steps.release.outputs.new_tag }}"

      - name: Create GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release.outputs.new_tag }}" \
            --title "${{ steps.release.outputs.new_tag }}" \
            --notes-file "${{ steps.release.outputs.notes_file }}"

      # Skipped (not failed) when no PYPI_API_TOKEN secret is configured: HAS_PYPI_TOKEN above is exactly that
      # check, and release.py only sets should_publish=true when it saw HAS_PYPI_TOKEN=true.
      - name: Build and publish to PyPI
        if: steps.release.outputs.released == 'true' && steps.release.outputs.should_publish == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine upload dist/*
