name: pr-labeler

# pull_request_target (not pull_request): runs with the base repo's permissions even for a PR from a fork, which
# is required to add labels to a fork PR. Safe here because release-drafter only reads PR metadata (title, changed
# file paths) through the GitHub API -- it does not check out or execute the PR's code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
