[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "media-analysis-skill"
version = "0.1.17"
description = "Deterministic media observation / analysis Skill (probe, streams, video/audio format, silence, loudness, integrity, scenes, timing). Not an AI agent."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "kajisho5"}]
keywords = ["ffmpeg", "ffprobe", "media", "analysis", "observation", "measurement", "deterministic", "loudness", "ebur128", "silence-detection", "scene-detection", "agent-skill", "video-production"]
dependencies = []

[project.optional-dependencies]
# speech_regions (ADR-035): CPU inference of the voice-activity model shipped in media_analysis/models
vad = ["onnxruntime>=1.16", "numpy>=1.21"]
# audio_events (ADR-036): CPU inference of the audio-event classifier shipped in media_analysis/models
events = ["onnxruntime>=1.16", "numpy>=1.21"]

[project.scripts]
media-analysis = "media_analysis.cli:main"

[project.urls]
Repository = "https://github.com/kajisho5/media-analysis-skill"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
media_analysis = ["models/*.onnx", "models/*.LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
